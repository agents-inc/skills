# yaml-language-server: $schema=https://raw.githubusercontent.com/agents-inc/cli/main/src/schemas/metadata.schema.json
category: web-styling
slug: theming
domain: web
author: "@vince"
displayName: Runtime Theming
cliDescription: Runtime light/dark and multi-brand theme switching
usageGuidance: >-
  Use when applying a theme system to a live app - wiring prefers-color-scheme
  and an explicit override, eliminating theme flash on first paint, persisting a
  light/dark/system preference, switching semantic token values per scope, or
  adding multi-brand and nested theme scopes.
