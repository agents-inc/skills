domain: web
author: "@vince"
displayName: Base UI
cliDescription: Unstyled accessible React primitives
usageGuidance: >-
  Use when building accessible UI with Base UI (@base-ui/react) — part-based
  anatomy (Portal, Positioner, Popup), the render prop for polymorphism,
  useRender and mergeProps, data-attribute state styling, controlled state with
  eventDetails cancelation, and Field/Fieldset/Form validation.
